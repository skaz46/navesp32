<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ESP NAV Controller</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <header class="status-header">
      <div class="brand">ESP NAV</div>
      <div class="indicators">
        <span id="gps-status-indicator" class="status-tag off">GPS ● OFF</span>
        <span id="device-status-indicator" class="status-tag off">DEVICE ● DISCONNECTED</span>
      </div>
    </header>

    <div id="map-container">
      <div id="map"></div>
    </div>

    <main class="control-panel">
      <section class="panel-section">
        <h2>LIVE TELEMETRY</h2>
        <div class="grid-2">
          <div><label>LAT</label><span id="val-lat">--</span></div>
          <div><label>LON</label><span id="val-lon">--</span></div>
          <div><label>ACCURACY</label><span id="val-acc">--</span></div>
          <div><label>SPEED/SPD</label><span id="val-spd">--</span></div>
        </div>
      </section>

      <section class="panel-section">
        <h2>DESTINATION</h2>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search destination..." />
          <button id="search-btn">Search</button>
        </div>
        <ul id="search-results" class="results-list hidden"></ul>

        <div class="destination-preview">
          <label>SELECTED TARGET</label>
          <p id="target-name">None selected</p>
        </div>

        <button id="send-btn" class="action-btn" disabled>SEND TO DEVICE</button>
      </section>

      <section class="panel-section">
        <h2>DEVICE CONNECTION</h2>

        <div class="destination-preview">
          <label>ESP32 STATUS</label>
          <p id="debug-log" class="log-text">
            Connecting to device...
          </p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/device.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
